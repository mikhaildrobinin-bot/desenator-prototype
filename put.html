 <div class="note"><h2>Подходит для машин</h2><p style="margin:0">${B.machinesLine(f)}</p><p class="hint">${f.w} × ${f.h} точек · ${tagLabel(f)}${S.edit||editsCount()?` · изменено точек: ${editsCount()}`:''}</p></div>`}
function aside(){const f=curFile(),ok=okFiles();
 return`<div class="notes" data-keep="notes">${checkHTML(f)}
 ${S.files.filter(x=>x.err).map(x=>`<div class="note bad"><b style="color:var(--error)">${esc(x.err)}</b><p class="hint">${esc(x.hint)}</p><button class="link" data-act="drawer" data-v="size">Изменить размер мотива</button></div>`).join('')}</div>
 ${ok.length?`<div class="dlbox"><button class="btn primary big" data-act="dlall">${ICON.down} Скачать ${ok.length===1?'BMP':ok.length+' '+plural(ok.length,'файл','файла','файлов')+' BMP'}</button>${ok.length>1&&f?`<button class="btn" data-act="dl" data-v="${f.key}">Только ${f.N}${S.layout==='pair'?' '+f.tag:''}</button>`:''}<small class="fname">${esc(ok.length===1?fileName(ok[0]):fileName(ok[0])+' и ещё '+(ok.length-1))}</small></div>`:''}`}
function paintAside(){const a=$('#aside');if(a)rerender(a,aside());const d=$('#checkc');if(d)rerender(d,checkHTML(curFile()))}
function pillHTML(){const pal=S.base.palette;return`${B.tools()}<span class="sep"></span><button class="cur-sw" data-act="pop" data-v="pal" style="--c:rgb(${pal[S.color]})" aria-label="Цвет ${S.color+1}, выбрать другой" aria-expanded="${pop==='pal'}"></button><span class="sep"></span>${B.history()}<button class="tool" data-act="pop" data-v="more" aria-label="Ещё: масштаб, сетка, симметрия" aria-expanded="${pop==='more'}">${I('<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>')}</button>`}
function popHTML(){if(pop==='pal')return`<div class="pop" role="dialog" aria-label="Цвета"><h3>Цвет для правки</h3>${B.palette(false)}</div>`;if(pop==='more')return`<div class="pop" role="dialog" aria-label="Вид"><h3>Вид и помощники</h3><div class="vgrid"><button type="button" class="tool mhand ${S.tool==='hand'?'on':''}" data-act="tool" data-v="hand" aria-pressed="${S.tool==='hand'}">${ICON.hand}<span>Рука</span></button><button type="button" class="tool mredo" data-act="redo" ${S.redo.length?'':'disabled'}>${ICON.redo}<span>Повторить</span></button>${B.view()}</div><p class="hint">${S.layout==='mirror'?'Отражение на второй стороне меняется само. ':''}Правка мотива меняется во всех форматах: ${[...new Set(okFiles().map(x=>x.N))].join(', ')}.</p></div>`;return''}
function paintPill(){const p=$('#pill');if(p){rerender(p,pillHTML());const o=$('#popslot');if(o)o.innerHTML=popHTML()}}
function knitHTML(f){const D=S.dims,K=D.useK?D.K:D.Kt;return`<div class="knitw"><div class="klab">${f.tag==='центр'?'<span>мотив по центру</span>':S.layout==='pair'?`<span>${f.tag==='прав'?'правый носок':'левый носок'}: правая сторона | левая сторона</span>`:'<span>правая сторона носка</span><span>|</span><span>левая сторона носка</span>'}</div><div class="kin"><div class="ribbon" aria-hidden="true">${f.viol.map(r=>`<b style="top:${(r-1)/f.h*100}%;height:${100/f.h}%"></b>`).join('')}</div><canvas id="knit" role="img" aria-label="Как свяжется: ${f.N} игл, ${f.w} на ${f.h} точек${f.viol.length?', '+f.viol.length+' '+plural(f.viol.length,'ряд','ряда','рядов')+' с лишним цветом':''}"></canvas></div>
 <p class="knote">Примерный вид: петля в ${fmtK(K)} раза шире, чем выше. Точный вид — на образце.</p></div>`}
function result(){const f=curFile(),files=S.files;
 if(!selected().length)return`<div class="res"><div class="note" style="max-width:520px;margin:var(--s8) auto"><h2>Выберите хотя бы одно число игл</h2><p class="hint">У отмеченных машин нет выбранных чисел игл — без этого макет не собрать.</p><div class="acts"><button class="btn primary" data-act="drawer" data-v="machines">Выбрать машину и иглы</button></div></div></div>`;
 return`<div class="res">${sayHTML()}
 <div class="bar"><div class="seg" role="tablist" aria-label="Формат" data-keep="seg">${files.map(x=>x.err?`<button disabled title="${esc(x.err)}" style="color:var(--error)">${x.N} ✕<span class="sr">, не собран</span></button>`:`<button role="tab" data-act="fmt" data-v="${x.key}" aria-selected="${x.key===S.cur}"><i class="${x.viol.length?'bad':''}" aria-hidden="true"></i>${x.N}${S.layout==='pair'?' '+x.tag:''}<em class="cnt ${x.viol.length?'':'ok'}" aria-hidden="true">${x.viol.length}</em><span class="sr">${x.viol.length?', '+x.viol.length+' '+plural(x.viol.length,'ряд','ряда','рядов')+' с лишним цветом':', без нарушений'}</span></button>`).join('')}</div><span class="sp"></span>
  <div class="seg" role="group" aria-label="Вид"><button data-act="vmode" data-v="knit" aria-pressed="${vmode==='knit'}"><span class="lf">Как свяжется</span><span class="ls">В петлях</span></button><button data-act="vmode" data-v="dots" aria-pressed="${vmode==='dots'}"><span class="lf">По точкам</span><span class="ls">Точки</span></button></div>
  <button class="master" role="switch" aria-checked="${S.edit}" data-act="edit"><i></i><span class="lf">Режим мастера</span><span class="ls">Правка</span></button></div>
 <div class="stagebox"><div class="show" id="show">${f?(vmode==='knit'?knitHTML(f):`<div class="cvbox" id="cvbox"></div>${S.edit?`<div class="rowchip" id="rowchip" aria-live="polite">${B.status(S.hover)}</div><div id="popslot">${popHTML()}</div><div class="pill-tools" id="pill" role="toolbar" aria-label="Инструменты мастера">${pillHTML()}</div>`:''}`):`<div class="knitw"><div class="note bad"><b>${esc(files[0].err)}</b><p class="hint">${esc(files[0].hint)}</p><button class="link" data-act="drawer" data-v="size">Изменить размер мотива</button></div></div>`}</div>
 <aside class="aside" id="aside" aria-label="Проверка и скачивание">${aside()}</aside></div></div>`}
const SECS=[['machines','Машина'],['needles','Числа игл'],['weave','Переплетение'],['height','Высота файла'],['layout','Раскладка мотива'],['size','Размер мотива и цвета']];
function drawerHTML(){
 if(drawer==='check')return`<div class="scrim" data-act="drawer"></div><div class="drawer" role="dialog" aria-modal="true" aria-labelledby="dh"><div class="dh"><h2 id="dh">Проверка макета</h2><button class="iconbtn" data-act="drawer" aria-label="Закрыть">${ICON.x}</button></div><div class="db" id="checkc" data-keep="db" style="display:grid;gap:var(--s3);padding-top:var(--s3)">${checkHTML(curFile())}</div><div class="df"><button class="btn" data-act="drawer">Готово</button></div></div>`;
 return`<div class="scrim" data-act="drawer"></div><div class="drawer" role="dialog" aria-modal="true" aria-labelledby="dh"><div class="dh"><h2 id="dh">Настройки макета</h2><button class="iconbtn" data-act="drawer" aria-label="Закрыть">${ICON.x}</button></div>
 <div class="db" data-keep="db">${SECS.map(([k,t])=>`<section id="sec-${k}" aria-labelledby="h-${k}"><h3 id="h-${k}">${t}</h3>${B[k]()}</section>`).join('')}
 <section aria-labelledby="h-bg"><h3 id="h-bg">Фон</h3>${B.palette(true)}<p class="hint">Фон найден по краям рисунка. Если ошиблись — выберите цвет и нажмите «Сделать фоном».</p></section></div>
 <div class="df"><button class="btn primary" data-act="drawer">Готово — показать макет</button></div></div>`}
App.render=()=>{
 if(!S.src)ready=false;if(S.loading||S.error||!S.src){S.edit=false;if(!S.src)drawer=null}
 const phase=!S.src||S.loading?'start':!ready?'ask':'result',f=curFile(),ok=okFiles();
 const foot=phase==='ask'?`<div class="foot"><button class="btn primary big" style="flex:1" data-act="show">Показать макет</button></div>`:
  phase==='result'&&ok.length?`<div class="foot">${f?`<button class="vb ${f.viol.length?'':'ok'}" data-act="drawer" data-v="check" aria-label="Проверка: ${f.viol.length?f.viol.length+' '+plural(f.viol.length,'ряд','ряда','рядов')+' с лишним цветом':'нарушений нет'}">${f.viol.length?ICON.warn+f.viol.length:ICON.ok}</button>`:''}<button class="btn primary" data-act="dlall">${ICON.down} Скачать ${ok.length===1?'BMP':ok.length+' BMP'}</button><button class="iconbtn" data-act="drawer" data-v="machines" aria-label="Настройки">${ICON.gear}</button></div>`:'';
 rerender($('#app'),`<div class="c"><header class="hd"><span class="brand">Десе<em>н</em>атор</span><span class="sp"></span>
  ${phase==='result'?`<button class="btn hidem" data-act="drawer" data-v="machines">${ICON.gear} Настройки</button><button class="btn hidem" data-act="new">${ICON.up} Другой рисунок</button>`:''}</header>
  <main class="scroll" data-keep="m" style="${phase==='result'?'overflow:hidden':''}">${phase==='start'?start():phase==='ask'?ask():result()}</main>
  ${foot}${drawer&&phase==='result'?drawerHTML():''}<input type="file" accept=".png,.jpg,.jpeg,.bmp,.webp,image/*" data-f="file" class="sr" tabindex="-1" aria-hidden="true"></div>`);
 if($('#srcc'))srcThumb($('#srcc'));
 if($('#deco'))deco($('#deco'));
 clearTimeout(slowT);if(S.loading)slowT=setTimeout(()=>{const s=$('#slow');if(s&&S.loading)s.textContent='Всё ещё переводим — большой рисунок обрабатывается дольше. Можно подождать или выбрать другой файл.'},10000);
 if($('#knit')&&f){const sh=$('#show'),kw=$('.knitw'),cs=getComputedStyle(kw),padX=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight),padY=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom),lab=$('.klab').offsetHeight,note=$('.knote').offsetHeight,gap=parseFloat(cs.rowGap)||8;
  drawKnit($('#knit'),f,Math.max(40,sh.clientWidth-padX-16),Math.max(40,sh.clientHeight-padY-lab-note-gap*2-2))}
 if($('#cvbox')){$('#cvbox').appendChild(cv);view=view||createView(cv,{labels:true,marks:fl=>showThin?thin(fl):null,onHover:h=>{const rc=$('#rowchip');if(rc)rc.innerHTML=B.status(h)}});App.view=view;requestAnimationFrame(()=>view.render())}
};
['dragenter','dragleave','drop'].forEach(t=>document.addEventListener(t,e=>{const d=$('#drop');if(d)d.classList.toggle('over',t==='dragenter')}));
let rsT;addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{if($('#knit'))App.render()},120)});
initProto('П-48 · макет (вариант В)');
</script></body></html>
